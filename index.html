<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bayu Minecraft</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: white;
      text-align: center;
    }
    .container {
      padding: 30px 15px;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      box-shadow: 0 0 20px orange;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 36px;
      margin: 10px 0 5px;
    }
    .subtitle {
      color: #facc15;
      font-size: 18px;
      margin-bottom: 20px;
    }
    .socials img {
      width: 40px;
      margin: 0 10px;
      border-radius: 8px;
    }
    .section {
      background: linear-gradient(135deg, #facc15, #fb923c);
      border-radius: 15px;
      padding: 20px;
      margin-top: 30px;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
    }
    .section h2 {
      margin: 0 0 20px;
      font-size: 22px;
      color: #000;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .item {
      background: #1e1e1e;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      color: #fff;
      display: inline-block;
      transition: 0.3s;
      text-decoration: none;
    }
    .item:hover {
      background: #2a2a2a;
    }
    .download {
      margin-top: 20px;
      background: #0ea5e9;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      padding: 10px 16px;
      display: inline-block;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://i.imgur.com/1X6VZbH.png" class="profile-img" alt="Bayu Logo" />
    <h1>BAYU</h1>
    <div class="subtitle">FREE</div>

    <div class="socials">
      <a href="#"><img src="https://img.icons8.com/color/48/tiktok--v1.png"/></a>
    </div>

    <div class="section">
      <h2>🎮 MINECRAFT 🎮</h2>
      <div class="grid">
        <a class="item" href="https://example.com/maps" target="_blank">🗺️ Maps</a>
        <a class="item" href="https://example.com/addons" target="_blank">🧩 Addons</a>
        <a class="item" href="https://example.com/textures" target="_blank">🌅 Textures</a>
        <a class="item" href="https://example.com/skins" target="_blank">👕 Skins</a>
      </div>
      <a class="download" href="#">⬇️ Download Minecraft ⬇️</a>
    </div>
  </div>
</body>
</html>
