      <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Bayu Addons</title>
  <style>
    body {
      background-color: #006666;
      color: #000;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 30px auto 10px;
      display: block;
      background-color: orange;
      object-fit: cover;
    }
    .tiktok-icon {
      width: 50px;
      margin-bottom: 20px;
    }
    .search-box {
      margin: 20px auto;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      width: 80%;
      max-width: 300px;
    }
    .addon-card {
      background: linear-gradient(to bottom, #66ccff, #3399ff);
      border-radius: 20px;
      margin: 20px auto;
      padding: 20px;
      max-width: 400px;
      color: black;
    }
    .addon-title {
      font-size: 20px;
      font-weight: bold;
    }
    .addon-link {
      display: inline-block;
      margin: 10px 0;
      padding: 10px 16px;
      background-color: #2222ff;
      color: white;
      text-decoration: none;
      border-radius: 12px;
    }
    .addon-img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Foto Profil -->
  <img src="https://yourdomain.com/foto.png" class="profile-img" alt="Foto Profil">

  <!-- Logo TikTok -->
  <a href="https://tiktok.com/@yourusername" target="_blank">
    <img src="https://img.icons8.com/color/48/tiktok--v1.png" class="tiktok-icon" alt="TikTok" />
  </a>

  <!-- Fitur Pencarian -->
  <input type="text" id="searchInput" class="search-box" placeholder="Cari addon...">

  <!-- Daftar Addon -->
  <div id="addonList">

    <!-- Addon 1 -->
    <div class="addon-card">
      <div class="addon-title">Villager Soldier</div>
      <a href="https://example.com/download.mcaddon" class="addon-link" target="_blank">Download</a>
      <img src="https://i.imgur.com/5OKK9ai.jpg" class="addon-img" alt="Villager Soldier">
    </div>

    <!-- Tambahkan addon berikutnya di bawah sini -->
    <!-- Contoh:
    <div class="addon-card">
      <div class="addon-title">Nama Addon</div>
      <a href="https://..." class="addon-link" target="_blank">Download</a>
      <img src="https://..." class="addon-img" alt="...">
    </div>
    -->

  </div>

  <!-- Script Filter -->
  <script>
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("keyup", function () {
      const filter = searchInput.value.toLowerCase();
      const addons = document.querySelectorAll(".addon-card");
      addons.forEach(card => {
        const title = card.querySelector(".addon-title").textContent.toLowerCase();
        card.style.display = title.includes(filter) ? "block" : "none";
      });
    });
  </script>

</body>
</html>
