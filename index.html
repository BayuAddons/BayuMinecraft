<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>BayuMinecraft Addons</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #181a1b;
      color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    .addon-box {
      background: #242628;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px #00ff66;
    }
    .addon-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .addon-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .btn-download {
      background-color: #007bff;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
    }
    .btn-download:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>📦 Addon Minecraft by Bayu</h1>
  <p>Download kumpulan addon keren & siap pakai di Minecraft PE/Bedrock!</p>

  <div class="addon-box">
    <img class="addon-img" src="https://example.com/gambar-addon.jpg" alt="Ambient Sounds V5" />
    <div class="addon-title">Ambient Sounds V5</div>
    <a class="btn-download" href="https://example.com/download-addon.mcaddon" target="_blank">⬇️ Download</a>
  </div>

  <div class="addon-box">
    <img class="addon-img" src="https://example.com/gambar2.jpg" alt="Fast & Furious Pack" />
    <div class="addon-title">Fast and Furious Vehicle Pack</div>
    <a class="btn-download" href="https://example.com/fast-car-pack.mcaddon" target="_blank">⬇️ Download</a>
  </div>

</body>
</html>
